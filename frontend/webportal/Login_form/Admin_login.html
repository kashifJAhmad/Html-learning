<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Student Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
            font-weight: bold;
        }

        .btn {
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h2>Admin Login</h2>

        <form id="adminLoginForm">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter Admin Email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter Password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Admin Access Code</label>
                <input type="password" class="form-control" id="access_code" placeholder="Enter Access Code" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

        <div class="text-center mt-3">
            <a href="../index.html" class="btn btn-outline-secondary">
                Back to Home
            </a>
        </div>

        <div id="message" class="mt-3 text-center"></div>

    </div>

    <script>
        document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {

            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const access_code = document.getElementById("access_code").value.trim();

            const message = document.getElementById("message");
            message.innerHTML = "";

            try {

                const response = await fetch("http://localhost:5000/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        access_code
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {

                    // Save login details
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("currentUserId", data.user.id);
                    localStorage.setItem("currentUserRole", data.user.role);
                    localStorage.setItem("currentUser", JSON.stringify(data.user));

                    message.innerHTML = `
                <div class="alert alert-success">
                    ${data.message}
                </div>
            `;

                    // Redirect to Admin Dashboard
                    setTimeout(() => {
                        window.location.href = "../admin-profile.html";
                    }, 1000);

                } else {

                    message.innerHTML = `
                <div class="alert alert-danger">
                    ${data.message}
                </div>
            `;

                }

            } catch (error) {

                console.error(error);

                message.innerHTML = `
            <div class="alert alert-danger">
                Unable to connect to the server.
            </div>
        `;
            }

        });
    </script>

</body>

</html>
